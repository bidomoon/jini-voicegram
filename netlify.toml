[build]
  command = "npm run build:netlify"
  publish = "dist-netlify"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/instagram"
  to = "/.netlify/functions/instagram"
  status = 200
  force = true
[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200
  force = true
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true
[[redirects]]
  from = "/api/studio"
  to = "/.netlify/functions/studio"
  status = 200
  force = true
[[redirects]]
  from = "/api/social"
  to = "/.netlify/functions/social"
  status = 200
  force = true
[[redirects]]
  from = "/api/auth/callback"
  to = "/.netlify/functions/auth"
  status = 200
  force = true
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true
[[redirects]]
  from = "/api/billing"
  to = "/.netlify/functions/billing"
  status = 200
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
